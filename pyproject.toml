[project]
name = "head-and-heart-chatbot"
version = "0.1.0"
description = "LangGraph chatbot that routes messages to an emotional or logical agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[project.scripts]
head-and-heart = "head_and_heart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/head_and_heart"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = ["eval: live-model evaluations (need GROQ_API_KEY); run with `pytest -m eval`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["head_and_heart"]

[tool.coverage.report]
fail_under = 85
show_missing = true
